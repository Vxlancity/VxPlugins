settings:
  auto-save-interval: 5
  clan-pvp-protection: true
  max-name-length: 16
  max-suffix-length: 4
  default-homes: 1
  base-protection-radius: 50
  
  diplomacy:
    max-allies: 3
    max-enemies: 10

  chat:
    enable-suffix: false
    suffix-format: " <gray>[<color:#ffaa00>%clan%</color>]</gray>"
    clan-chat-format: "<dark_gray>[<color:#ffaa00>CC</color>] <gray>%player%<dark_gray>: <white>%message%"

  sounds:
    gui-open: "BLOCK_CHEST_OPEN"
    gui-click: "UI_BUTTON_CLICK"
    success: "ENTITY_PLAYER_LEVELUP"
    error: "ENTITY_VILLAGER_NO"
    teleport: "ENTITY_ENDERMAN_TELEPORT"
    deposit: "ENTITY_EXPERIENCE_ORB_PICKUP"
    withdraw: "BLOCK_ANVIL_USE"
    invite: "ENTITY_PLAYER_LEVELUP"
    clan-create: "UI_TOAST_CHALLENGE_COMPLETE"
    role-change: "BLOCK_NOTE_BLOCK_PLING"

  particles:
    teleport-enabled: true
    teleport-particle: "PORTAL"
    teleport-count: 50

messages:
  prefix: "<dark_gray>» <color:#ffaa00>VxClans</color> <dark_gray>│ <gray>"
  no-permission: "<red>✘ Dazu hast du keine Rechte!"
  not-in-clan: "<red>✘ Du bist in keinem Clan!"
  clan-not-found: "<red>✘ Clan nicht gefunden!"
  only-players: "<red>✘ Nur für Spieler!"
  usage-sethome: "<red>✘ Verwendung: <white>/sethome <name>"
  usage-delhome: "<red>✘ Verwendung: <white>/delhome <name>"
  home-exists: "<red>✘ Du hast bereits ein Home mit diesem Namen!"
  home-limit: "<red>✘ Du hast dein Home-Limit von <white>%limit% <red>erreicht!"
  home-set: "<green>✔ Home <white>%name% <green>wurde gesetzt!"
  home-not-found: "<red>✘ Home <white>%name% <red>existiert nicht!"
  home-deleted: "<green>✔ Home <white>%name% <green>wurde gelöscht!"
  teleport-clan-base: "<green>✔ Du wurdest zur <white>Clan-Base <green>teleportiert."
  teleport-home: "<green>✔ Du wurdest zu <white>%name% <green>teleportiert."
  usage-create: "<red>✘ Verwendung: <white>/clan create <name> <suffix>"
  already-in-clan: "<red>✘ Du bist bereits in einem Clan!"
  clan-name-exists: "<red>✘ Ein Clan mit diesem Namen existiert bereits!"
  clan-created: "<green>✔ Clan <white>%name% <green>wurde erfolgreich erstellt!"
  clan-base-set: "<green>✔ Clan-Base wurde erfolgreich gesetzt!"
  owner-leave: "<red>✘ Du bist der Owner! Übertrage zuerst den Rang oder lösche den Clan."
  clan-deleted-last: "<green>✔ Clan wurde gelöscht, da du das letzte Mitglied warst."
  clan-left: "<green>✔ Du hast den Clan verlassen."
  not-enough-money: "<red>✘ Du hast nicht genug Geld!"
  clan-not-enough-money: "<red>✘ Die Clan-Kasse hat nicht genug Geld!"
  deposit: "<green>✔ Du hast <white>%amount%$ <green>eingezahlt."
  withdraw: "<green>✔ Du hast <white>%amount%$ <green>ausgezahlt."
  need-admin: "<red>✘ Dazu musst du mindestens <white>Clan-Admin <red>sein!"
  need-moderator: "<red>✘ Dazu musst du mindestens <white>Clan-Moderator <red>sein!"
  role-cant-edit: "<red>✘ Du kannst diese Rolle nicht bearbeiten!"
  owner-only: "<red>✘ Nur der <white>Clan-Owner <red>kann das tun!"
  role-transfer: "<green>✔ Du hast die Owner-Rolle übertragen!"
  role-changed: "<green>✔ Die Rolle wurde auf <white>%role% <green>geändert!"
  clan-invite-usage: "<red>✘ Verwendung: <white>/clan invite <spieler>"
  clan-invite-sent: "<green>✔ Du hast <white>%player% <green>eingeladen!"
  clan-invite-received: "<green>✔ Du wurdest vom Clan <white>%clan% <green>eingeladen! Tippe <white>/clan accept"
  no-invite: "<red>✘ Du hast keine offene Einladung!"
  clan-joined: "<green>✔ Du bist dem Clan beigetreten!"
  clan-joined-broadcast: "<green>✔ <white>%player% <green>ist dem Clan beigetreten!"
  clan-kick-usage: "<red>✘ Verwendung: <white>/clan kick <spieler>"
  clan-kick: "<green>✔ Du hast <white>%player% <green>aus dem Clan geworfen!"
  clan-kicked: "<red>✘ Du wurdest aus dem Clan geworfen!"
  player-not-found: "<red>✘ Spieler nicht gefunden oder nicht online!"
  player-not-in-clan: "<red>✘ Dieser Spieler ist nicht in deinem Clan!"
  cant-kick-higher: "<red>✘ Du kannst diesen Spieler nicht kicken! Er hat einen höheren Rang."
  clan-delete-confirm: "<red>⚠ Tippe <white>/clan confirm <red>innerhalb von 30 Sekunden, um den Clan unwiderruflich zu löschen."
  clan-deleted: "<green>✔ Clan wurde unwiderruflich gelöscht!"
  no-pending-confirm: "<red>✘ Es gibt nichts zu bestätigen."
  config-reloaded: "<green>✔ Konfiguration wurde erfolgreich neu geladen!"
  clan-rename-usage: "<red>✘ Verwendung: <white>/clan rename <name>"
  clan-renamed: "<green>✔ Clan umbenannt zu <white>%name%<green>!"
  clan-setsuffix-usage: "<red>✘ Verwendung: <white>/clan setsuffix <suffix>"
