  clan-chat-usage: "<red>✘ Verwendung: <white>/cc <nachricht>"
  clan-base-not-set: "<red>✘ Die Clan-Base wurde noch nicht gesetzt!"
  help-header: "<dark_gray>╔══════════════════════════════════════╗"
  help-footer: "<dark_gray>╚══════════════════════════════════════╝"

