protection:
  # Ob Clan-Bases geschützt sind (false = claims komplett deaktiviert)
  enabled: true
  # Radius um die Clan-Base (in Blöcken)
  radius: 30.0
  # Nachricht wenn Gebiet geschützt ist
  message: "<red>§l✘ §cDieses Gebiet gehört einem anderen Clan!"

quests:
  # Ob das Clan-Quest-System aktiviert ist
  enabled: true
