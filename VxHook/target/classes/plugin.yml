name: VXHook
version: '1.0.0'
main: de.vxplugins.hook.VXHookPlugin
api-version: '1.21'
folia-supported: true
author: VXPlugins
description: Smooth, physics-driven grappling hooks built for modern performance and zero server lag.

commands:
  vxhook:
    description: Main command for VXHook.
    aliases: [vxh]
    permission: vxhook.admin
    usage: /<command> [give <player> [amount] | reload]

permissions:
  vxhook.use:
    description: Allows launching and using grappling hooks.
    default: true
  vxhook.bypass.cooldown:
    description: Ignores configured hook cooldowns.
    default: op
  vxhook.admin.give:
    description: Gives a ready-to-use hook to a player.
    default: op
  vxhook.admin.reload:
    description: Reloads config.yml and language files.
    default: op
  vxhook.admin:
    description: Full administrative access to VXHook.
    default: op
    children:
      vxhook.admin.give: true
      vxhook.admin.reload: true

